<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">arv</title>
  <!-- A disc from above: three tracks (Archive, Record, Verify), the clear hub ring where the id
       and the copy letter are written, and the hole. The hole is cut out, so any background shows. -->
  <style>
    .disc { fill: #2f5d8a; }
    .track { fill: none; stroke: #ffffff; stroke-opacity: .55; stroke-width: 1.6; }
    .hub { fill: #ffffff; fill-opacity: .9; }
    @media (prefers-color-scheme: dark) {
      .disc { fill: #79b8ff; }
      .track { stroke: #0d1117; }
      .hub { fill: #0d1117; }
    }
  </style>
  <defs>
    <mask id="hole">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="32" r="5" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#hole)">
    <circle class="disc" cx="32" cy="32" r="30"/>
    <circle class="track" cx="32" cy="32" r="25"/>
    <circle class="track" cx="32" cy="32" r="20.5"/>
    <circle class="track" cx="32" cy="32" r="16"/>
    <circle class="hub" cx="32" cy="32" r="11"/>
  </g>
</svg>
